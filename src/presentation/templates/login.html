{% extends "base.html" %}

{% block title %}{{ t('login_title') }}{% endblock %}

{% block head %}
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f1720;
    color: #e6edf3;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .box {
    background: #16212c;
    border: 1px solid #2a3b4a;
    border-radius: 12px;
    padding: 32px;
    width: 340px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    position: relative;
  }
  .lang-switcher-login {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 6px;
    font-size: 12px;
  }
  .lang-switcher-login a {
    text-decoration: none;
    color: #93a4b3;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .lang-switcher-login a.active {
    color: #4da3ff;
    background: rgba(77,163,255,0.15);
    border: 1px solid #4da3ff;
  }
  .badge-arch {
    display: inline-block;
    background: rgba(77, 163, 255, 0.15);
    color: #4da3ff;
    border: 1px solid #4da3ff;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: bold;
    border-radius: 4px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .subtitle { font-size: 13px; color: #8c9ba8; margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: #93a4b3; margin-bottom: 6px; }
  input {
    width: 100%;
    box-sizing: border-box;
    background: #1c2b38;
    border: 1px solid #2a3b4a;
    color: #e6edf3;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    margin-bottom: 14px;
  }
  input:focus {
    outline: none;
    border-color: #4da3ff;
  }
  button {
    width: 100%;
    background: #4da3ff;
    border: none;
    color: #04141f;
    font-weight: 700;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #3b8ce0; }
  .error {
    background: rgba(240, 97, 109, 0.15);
    border: 1px solid #f0616d;
    color: #f0616d;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 14px;
  }
</style>
{% endblock %}

{% block content %}
  <form class="box" method="post">
    <div class="lang-switcher-login" style="align-items: center; gap: 4px;">
      <label for="loginLangSelect" style="font-size: 13px; margin: 0; cursor: pointer; color: #4da3ff;">🌐</label>
      <select id="loginLangSelect" onchange="window.location.href='/set-lang/' + this.value"
              style="background: #1c2b38; color: #e6edf3; border: 1px solid #2a3b4a; border-radius: 6px; padding: 2px 6px; font-size: 11px; font-weight: 600; cursor: pointer; outline: none;">
        {% for lang in supported_languages %}
          <option value="{{ lang.code }}" {% if current_lang == lang.code %}selected{% endif %}>
            {{ lang.flag }} {{ lang.code|upper }}
          </option>
        {% endfor %}
      </select>
    </div>

    <span class="badge-arch">{{ t('tier_badge') }}</span>
    <h1>{{ t('login_heading') }}</h1>
    <p class="subtitle">{{ t('login_sub') }}</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <label for="u">{{ t('username_label') }}</label>
    <input id="u" name="username" autofocus required>
    
    <label for="p">{{ t('password_label') }}</label>
    <input id="p" name="password" type="password" required>
    
    <button type="submit">{{ t('login_submit') }}</button>
  </form>
{% endblock %}
